# Weekly update PRs for everything that's pinned: Go modules, the Actions' commit
# SHAs, and the base images' digests. CI runs on each PR before anything merges.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /api
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly

  # The web front end's npm packages (pnpm-lock.yaml) and its base images. Dev tools
  # are grouped; Next.js and React updates come on their own, to review separately.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      dev-tools:
        dependency-type: development

  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
