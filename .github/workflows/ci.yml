# Test, lint, and vulnerability-scan the API, then build its image and scan that too.
# Nothing is pushed; publishing to GHCR and signing come in a separate workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API test / lint / govulncheck
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      # Actions are pinned to commit SHAs; a moved tag can't change what runs here
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      # Every module matches the checksum recorded in go.sum
      - name: go mod verify
        run: go mod verify

      - name: go vet
        run: go vet ./...

      # Includes the end-to-end test against the real auth module and a Postgres
      # container (the runner has Docker)
      - name: go test
        run: go test -race -count=1 ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: api

      # Go's own vulnerability database; reports only vulnerabilities in code this
      # program can actually reach
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  api-image:
    name: API image build / scan
    runs-on: ubuntu-24.04
    needs: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: api
          push: false
          load: true
          tags: cyberlab-mirror-api:ci

      # The image must run as the nonroot user, start against a real Postgres, answer
      # its health check on the ops port only, and refuse what it should refuse
      - name: Smoke test
        run: |
          test "$(docker image inspect cyberlab-mirror-api:ci --format '{{.Config.User}}')" = "65532:65532"
          docker network create smoke
          docker run -d --name db --network smoke \
            -e POSTGRES_USER=mirror -e POSTGRES_PASSWORD=mirror -e POSTGRES_DB=mirror \
            postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
          for _ in $(seq 30); do docker exec db pg_isready -U mirror -d mirror && break; sleep 1; done
          # Dummy credentials: the GitHub list fails (logged), and no email is sent
          docker run -d --name api --network smoke -p 8080:8080 -p 9090:9090 \
            --tmpfs /data:uid=65532,gid=65532 \
            -e DATABASE_URL=postgres://mirror:mirror@db:5432/mirror?sslmode=disable \
            -e GITHUB_TOKEN=dummy -e APP_URL=http://localhost:3000 \
            -e AUTH_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            -e RESEND_API_KEY=dummy -e MAIL_FROM='Smoke <smoke@example.com>' \
            -e ALLOWED_EMAILS=me@example.com \
            cyberlab-mirror-api:ci
          curl -fsS --retry 15 --retry-delay 1 --retry-connrefused http://localhost:9090/healthz
          curl -fsS -o /dev/null http://localhost:9090/metrics
          # Metrics aren't on the API port, and the mirror needs a session
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/metrics)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/repos)" = 401
          # A stranger's sign-up gets the module's normal answer, and creates nothing
          test "$(curl -s -X POST -H 'Content-Type: application/json' \
            -d '{"email":"stranger@example.com","password":"correct horse battery staple","client":"web"}' \
            http://localhost:8080/v1/users)" = '{"verification_required":true}'
          test "$(docker exec db psql -U mirror -d mirror -Atc 'select count(*) from auth.users')" = 0
          docker logs api
          docker rm -f api db

      # Trivy from its official image, pinned by digest like the base images. Fails
      # on HIGH or CRITICAL vulnerabilities that have a fix available.
      - name: Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --no-progress --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            cyberlab-mirror-api:ci

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan every commit, not just the latest
          persist-credentials: false

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --no-banner
