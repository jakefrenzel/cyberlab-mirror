# Publish a release: build, scan, push to GHCR, then sign each image and its SBOM with
# cosign. Runs only for version tags (git tag v0.1.0 && git push origin v0.1.0). One
# tag releases every image in the repository at that version: the API and the web
# front end.
#
# Signing is keyless: GitHub issues this workflow run an OIDC token, Sigstore's CA
# exchanges it for a short-lived certificate naming this repository and workflow, and
# the signature is recorded in Sigstore's public transparency log (Rekor). There is no
# signing key to store or leak; "signed by release.yml in jakefrenzel/cyberlab-mirror"
# is what the cluster will verify.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: ${{ matrix.name }} build / scan / push / sign
    runs-on: ubuntu-24.04
    strategy:
      # One image failing its scan stops the other's release too
      fail-fast: true
      matrix:
        include:
          - component: api
            name: API
            description: "cyberlab-mirror API: GitHub mirror behind atlasopsec/auth"
          - component: web
            name: Web
            description: "cyberlab-mirror web front end (Next.js, atlasopsec/auth template)"
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # OIDC token for keyless signing
    env:
      IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.component }}
      LOCAL: cyberlab-mirror-${{ matrix.component }}:release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tags
        id: tags
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "list<<EOF"
            echo "$IMAGE:$version"
            echo "$IMAGE:sha-${GITHUB_SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build into the local Docker engine first: nothing is pushed until the scan passes
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component }}
          load: true
          tags: ${{ env.LOCAL }}
          # The API stamps it into its binary; the web build ignores it
          build-args: VERSION=${{ steps.tags.outputs.version }}

      - name: Trivy gate
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --no-progress --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            "$LOCAL"

      # SPDX software bill of materials: every package in the image
      - name: SBOM
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --no-progress --format spdx-json --output /out/sbom.spdx.json \
            "$LOCAL"
          jq -r '"SBOM: \(.packages | length) packages"' sbom.spdx.json

      # The token goes in through stdin, never on the command line
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      # Same build again (from cache), pushed, with SLSA build provenance attached
      - name: Push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.description=${{ matrix.description }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # Sign the digest, not a tag: tags can be moved, digests can't
      - name: Sign image and attest SBOM
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE@$DIGEST"

      # Prove it: verify both exactly the way the cluster will
      - name: Verify
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          cosign verify-attestation "$IMAGE@$DIGEST" --type spdxjson \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          {
            echo "### Published"
            echo
            echo '```'
            echo "$IMAGE:${{ steps.tags.outputs.version }}@$DIGEST"
            echo '```'
            echo
            echo "Signature and SBOM attestation verified for \`$IDENTITY\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # Matrix jobs can't set per-entry outputs, so each image's digest travels to
      # the deploy job as a small artifact
      - name: Record the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "$DIGEST" > "digest-${{ matrix.component }}.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.component }}
          path: digest-${{ matrix.component }}.txt
          retention-days: 1

  # Open a pull request in cyberlab-infra that deploys this release. Merging it is the
  # deploy: Argo CD syncs main. Runs only after every image is signed and verified.
  bump-infra:
    name: Open deploy PR in cyberlab-infra
    runs-on: ubuntu-24.04
    needs: image
    # The token is an environment secret: the infra-bump environment only hands it to
    # jobs running from a v* tag. It's a fine-grained token limited to cyberlab-infra
    # (contents + pull requests); this repository's own token stays read-only.
    environment: infra-bump
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true

      - name: Check inputs
        id: inputs
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          for c in api web; do
            d=$(cat "digest-$c.txt")
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad $c digest: $d"; exit 1; }
            echo "$c=$d" >> "$GITHUB_OUTPUT"
          done

      - name: Commit the new tags and digests, open a PR
        env:
          GH_TOKEN: ${{ secrets.INFRA_PR_TOKEN }}
          VERSION: ${{ steps.inputs.outputs.version }}
          API_DIGEST: ${{ steps.inputs.outputs.api }}
          WEB_DIGEST: ${{ steps.inputs.outputs.web }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          file=k8s/cyberlab-mirror/kustomization.yaml
          branch="deploy/cyberlab-mirror-v$VERSION"
          api=ghcr.io/jakefrenzel/cyberlab-mirror-api
          web=ghcr.io/jakefrenzel/cyberlab-mirror-web

          gh repo clone jakefrenzel/cyberlab-infra infra -- --depth 1
          cd infra
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"

          # bump changes one image's entry only: the file lists one per image (name,
          # newTag, digest)
          bump() {
            local image=$1 digest=$2
            sed -i -E "\|^  - name: $image\$|,\|^    digest:| {
              s|^(    newTag: ).*|\1\"$VERSION\"|
              s|^(    digest: ).*|\1$digest|
            }" "$file"
            if ! grep -A2 -x "  - name: $image" "$file" | grep -q "newTag: \"$VERSION\"" \
              || ! grep -A2 -x "  - name: $image" "$file" | grep -q "digest: $digest"; then
              echo "kustomization.yaml didn't take the new values for $image"; cat "$file"; exit 1
            fi
          }
          bump "$api" "$API_DIGEST"
          bump "$web" "$WEB_DIGEST"
          if git diff --quiet; then
            echo "cyberlab-infra already runs v$VERSION"
            exit 0
          fi

          git commit -am "Deploy cyberlab-mirror v$VERSION"
          # gh's credential helper supplies the token for the push
          gh auth setup-git
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Deploy cyberlab-mirror v$VERSION" \
            --body "$(printf '%s\n' \
              "Deploys [cyberlab-mirror v$VERSION](https://github.com/jakefrenzel/cyberlab-mirror/releases/tag/v$VERSION)." \
              "" \
              '```' "$api:$VERSION@$API_DIGEST" "$web:$VERSION@$WEB_DIGEST" '```' \
              "" \
              "Built, scanned, signed, and verified by [this release run]($RUN_URL). Merging deploys it: Argo CD syncs \`main\`." \
              "" \
              "Verify a signature yourself (the same for the web image):" \
              '```bash' \
              "cosign verify $api@$API_DIGEST \\" \
              "  --certificate-identity https://github.com/jakefrenzel/cyberlab-mirror/.github/workflows/release.yml@refs/tags/v$VERSION \\" \
              "  --certificate-oidc-issuer https://token.actions.githubusercontent.com" \
              '```')"
